<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aula de estudio ASIR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: inicio con tarjetas de asignaturas; dentro, un servicio por pestaña: mapa, tabla de cambios y ejercicios */
  --bg:#f2f5f7; --surface:#ffffff; --ink:#13222b; --muted:#566874; --line:#d5dde3; --line-strong:#aebbc4;
  --accent:#0b7a75; --accent-soft:#d8efec; --on-accent:#ffffff;
  --violet:#5b4bc4; --violet-soft:#e5e2fa;
  --good:#1b7f4b; --good-soft:#dbf3e5; --bad:#b3261e; --bad-soft:#fbe1de; --code-bg:#e9eef2;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b1216; --surface:#121c22; --ink:#e5eef2; --muted:#8ea2ad; --line:#243540; --line-strong:#3b5260;
    --accent:#3cc4b8; --accent-soft:#12373a; --on-accent:#062a27;
    --violet:#a99cf5; --violet-soft:#272352;
    --good:#5fd08e; --good-soft:#12301f; --bad:#ff8a80; --bad-soft:#3a1a18; --code-bg:#0e171c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1216; --surface:#121c22; --ink:#e5eef2; --muted:#8ea2ad; --line:#243540; --line-strong:#3b5260;
  --accent:#3cc4b8; --accent-soft:#12373a; --on-accent:#062a27;
  --violet:#a99cf5; --violet-soft:#272352;
  --good:#5fd08e; --good-soft:#12301f; --bad:#ff8a80; --bad-soft:#3a1a18; --code-bg:#0e171c;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--body);-webkit-text-size-adjust:100%}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{border-bottom:1px solid var(--line);background:var(--surface)}
.top .in{max-width:1040px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font:700 18px var(--display)}
.logo{background:var(--accent);color:var(--on-accent);border-radius:6px;padding:2px 8px;font:700 14px var(--mono);letter-spacing:.04em}
.grade{color:var(--muted);font-size:14px}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px 56px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:32px;line-height:1.15}
h2{font-size:26px;line-height:1.2}
h3{font-size:17px;margin-bottom:10px}
.lead{color:var(--muted);margin:6px 0 22px;max-width:62ch}
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.subj{display:block;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;color:inherit;text-decoration:none}
.subj.on:hover{border-color:var(--accent)}
.subj.off{opacity:.6}
.ban{height:92px}
.subj .tx{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.subj h3{font-size:15px;margin:0;line-height:1.3}
.subj .sub{font-size:13px;color:var(--muted)}
.badge{align-self:flex-start;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.subj.off .badge{background:var(--code-bg);color:var(--muted)}
.b1{background:linear-gradient(90deg,rgba(255,255,255,.22) 2px,transparent 2px) 0 0/24px 24px,linear-gradient(rgba(255,255,255,.22) 2px,transparent 2px) 0 0/24px 24px,#2a86a3}
.b2{background:repeating-linear-gradient(60deg,rgba(255,255,255,.22) 0 40px,transparent 40px 80px),#69bdbe}
.b3{background:repeating-linear-gradient(-60deg,rgba(0,0,0,.1) 0 40px,transparent 40px 80px),#1fa384}
.b4{background:radial-gradient(circle at 22% 30%,#2a8a96 0,transparent 42%),radial-gradient(circle at 80% 80%,#1c5a73 0,transparent 45%),#0e2430}
.b5{background:repeating-linear-gradient(60deg,rgba(255,255,255,.14) 0 45px,transparent 45px 90px),#6a58d2}
.b6{background:radial-gradient(circle,transparent 0 16px,rgba(255,255,255,.3) 16px 18px,transparent 18px) 0 0/42px 42px,#66c0be}
.b7{background:repeating-linear-gradient(90deg,rgba(255,255,255,.16) 0 12px,transparent 12px 24px),repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 12px,transparent 12px 24px),#1a78dc}
.b8{background:radial-gradient(circle,rgba(255,255,255,.3) 1.5px,transparent 2px) 0 0/26px 26px,linear-gradient(120deg,#0d2a3b,#15556f)}
.soon{color:var(--muted);font-size:14px;margin-top:18px}
.crumb{display:inline-block;margin-bottom:10px;font-size:14px;text-decoration:none}
.sum{display:flex;align-items:center;gap:14px;margin:14px 0 18px;flex-wrap:wrap}
.sum .bar{flex:1;min-width:160px;height:8px;border-radius:99px;background:var(--code-bg);overflow:hidden}
.sum .bar i{display:block;height:100%;width:0;background:var(--accent)}
.sum span{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs a{padding:8px 16px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);text-decoration:none;font-weight:500;font-size:14px}
.tabs a.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.card svg{display:block;width:100%;max-width:680px;margin:0 auto;height:auto}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:13px}
td:first-child{font-weight:500;white-space:nowrap}
.rules{margin:12px 0 0;padding-left:18px;font-size:14px;color:var(--muted)}
.rules li{margin:3px 0}
svg .t{font:500 14px var(--body);fill:var(--ink)}
svg .ts{font:400 12px var(--body);fill:var(--muted)}
svg .bn{fill:var(--surface);stroke:var(--line-strong);stroke-width:1}
svg .ba{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1}
svg .bv{fill:var(--violet-soft);stroke:var(--violet);stroke-width:1}
svg .dash{fill:none;stroke:var(--line-strong);stroke-width:1;stroke-dasharray:4 4}
svg .ar{stroke:var(--muted);stroke-width:1.5;fill:none}
svg .lf{stroke:var(--line-strong);stroke-width:1;stroke-dasharray:3 4}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.pill,.btn{font:500 14px var(--body);padding:7px 12px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer}
.pill:hover,.btn:hover{border-color:var(--accent)}
.pill.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.pill.done::before{content:"\2713\00a0"}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.r-note{font-size:14px;color:var(--muted);margin-bottom:8px}
.r-code{font:400 13px/2.15 var(--mono);white-space:pre-wrap;background:var(--code-bg);border-radius:10px;padding:12px 14px;color:var(--ink);overflow-wrap:anywhere}
.blank{font:inherit;display:inline-block;min-width:68px;padding:0 6px;line-height:1.7;border:1px dashed var(--line-strong);border-radius:5px;background:var(--surface);color:var(--ink);cursor:pointer;text-align:center}
.blank.f{border-style:solid}
.blank.over{background:var(--accent-soft);border-color:var(--accent)}
.blank.ok{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.blank.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.r-help{font-size:13px;color:var(--muted);margin:10px 0 6px}
.r-bank{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:400 13px var(--mono);padding:5px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);cursor:grab;user-select:none}
.chip.sel{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.r-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.r-msg{margin-top:10px;font-weight:500;min-height:1.5em}
.r-msg.good{color:var(--good)} .r-msg.bad{color:var(--bad)}
.r-fb{margin:6px 0 0;padding-left:18px;font-size:14px;color:var(--muted)}
.exhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.tag{font-size:13px;font-weight:500;padding:2px 10px;border-radius:999px;background:var(--violet-soft);color:var(--violet)}
.mb{display:flex;flex-direction:column;gap:10px}
.mbr{display:grid;grid-template-columns:1fr 24px 1fr;gap:8px;align-items:center}
.mbr small{grid-column:1/-1;color:var(--muted);font-size:12px;margin-top:-4px}
.mbr code{font:400 12px/1.5 var(--mono);padding:8px 10px;border-radius:8px;overflow-wrap:anywhere}
.mbr code.bad{background:var(--bad-soft);color:var(--bad)}
.mbr code.good{background:var(--good-soft);color:var(--good)}
.mba{text-align:center;color:var(--muted);font-size:18px}
.lad{display:flex;align-items:center;gap:10px;margin:0 0 6px;font-size:13px}
.lad b{font:500 13px var(--mono);width:64px;flex:none}
.lb{height:24px;border-radius:6px;display:flex;align-items:center;padding:0 8px;min-width:0;white-space:nowrap;overflow:hidden}
.lb span{font-size:12px;overflow:hidden;text-overflow:ellipsis}
.lb.bad{background:var(--bad-soft);color:var(--bad)}
.lb.warn{background:var(--violet-soft);color:var(--violet)}
.lb.ok{background:var(--good-soft);color:var(--good)}
.flow{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap}
.fa{align-self:center;color:var(--muted)}
.fb{flex:1;min-width:120px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface)}
.fb b{display:block;font:500 14px var(--mono);margin-bottom:3px}
.fb small{display:block;font-size:12px;color:var(--muted);line-height:1.4}
.two{display:flex;gap:10px;flex-wrap:wrap}
.tec{margin:0;padding-left:20px;font-size:14px}
.tec li{margin:5px 0}
code{font-family:var(--mono);font-size:.92em}
.qprog{font-size:13px;color:var(--muted);margin-bottom:8px;font-variant-numeric:tabular-nums}
.qmeta{margin-bottom:8px}
.qt{font:500 16px/1.45 var(--body);margin:0 0 10px}
.qk{font:400 13px/1.6 var(--mono);background:var(--code-bg);border-radius:10px;padding:10px 12px;margin:0 0 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;font:400 14px/1.45 var(--body);padding:10px 12px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt i{font:500 12px var(--mono);font-style:normal;flex:none;width:22px;height:22px;border-radius:50%;background:var(--code-bg);display:grid;place-items:center;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.fbk{margin-top:12px;font-size:14px;line-height:1.5}
.fbk.good b{color:var(--good)}
.fbk.bad b{color:var(--bad)}
.exh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.grid{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 14px}
.gn{font:500 12px var(--mono);width:30px;height:28px;border-radius:6px;border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);cursor:pointer;padding:0}
.gn.dn{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.gn.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.big{font:700 26px var(--display);margin:4px 0 6px}
.rev{border-top:1px solid var(--line);padding:12px 0}
.rv{margin:2px 0;font-size:14px}
.rv.bad{color:var(--bad)}.rv.good{color:var(--good)}
.rx{margin:6px 0 0;font-size:13px;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
@media (max-width:520px){.mbr{grid-template-columns:1fr}.mba{transform:rotate(90deg)}}
@media (max-width:520px){h1{font-size:26px}h2{font-size:22px}}
</style>
</head>
<body>
<header class="top"><div class="in"><a class="brand" href="#inicio"><span class="logo">ASIR</span><span>Aula de estudio</span></a><span class="grade">2º ASIR Vespertino</span></div></header>
<div class="wrap">
<section id="view-inicio">
<h1>Tus asignaturas</h1>
<div class="subjects" id="subjects"></div>
<p class="soon">Las demás asignaturas se irán añadiendo.</p>
</section>
<section id="view-sri" hidden>
<a class="crumb" href="#inicio">← Asignaturas</a>
<h2>Servicios en Red e Internet · parte práctica</h2>
<div class="sum"><div class="bar" role="progressbar" aria-label="Ejercicios sin fallos"><i id="bar"></i></div><span id="count"></span></div>
<nav class="tabs" id="tabs" aria-label="Servicios"></nav>
<div id="panels"></div>
</section>
<section id="view-bd" hidden>
<a class="crumb" href="#inicio">← Asignaturas</a>
<h2>Gestores de Bases de Datos · UT02 Optimización SQL</h2>
<div class="sum"><div class="bar" role="progressbar" aria-label="Preguntas acertadas"><i id="bd-bar"></i></div><span id="bd-sum"></span></div>
<nav class="tabs" id="bd-tabs" aria-label="Secciones"></nav>
<div id="bd-panels"></div>
</section>
</div>

{id:'dns-check',svc:'dns',tab:'comprobaciones',file:'server1 · terminal',note:'Orden: sintaxis, zona directa, zona inversa, reinicio, estado.',

function $(s,r){return(r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

EX.forEach(function(ex){
  ex.parts=[];ex.items=[];var n=0;
  ex.lines.forEach(function(l){
    var parts=[],last=0;
    l.replace(/\[\[(.+?)(?:\|(.+?))?\]\]/g,function(m,a,h,off){
      parts.push({t:l.slice(last,off)});parts.push({b:n});ex.items.push({a:a,h:h||''});n++;last=off+m.length;return m;
    });
    parts.push({t:l.slice(last)});ex.parts.push(parts);
  });
  var hm={};
  ex.items.forEach(function(it){if(it.h&&!hm[it.a])hm[it.a]=it.h});

function Runner(root,onDone){
  root.innerHTML='<div class="r-note"></div><div class="r-code" role="group" aria-label="Fichero con huecos"></div><p class="r-help">Toca una palabra y luego un hueco, o arrástrala. Se pueden repetir y algunas sobran.</p><div class="r-bank"></div><div class="r-btns"><button type="button" class="btn primary" data-a="check">Comprobar</button><button type="button" class="btn" data-a="solve">Ver solución</button><button type="button" class="btn" data-a="reset">Reiniciar</button></div><div class="r-msg" aria-live="polite"></div><ul class="r-fb"></ul>';
  var ex=null,fill=[],res=null,sel=null,words=[];
  function msg(t,c){var m=$('.r-msg',root);m.textContent=t;m.className='r-msg'+(c?' '+c:'');$('.r-fb',root).innerHTML=''}
  function setW(i,w){fill[i]=w;res=null;msg('');render()}
  function render(){
    $('.r-note',root).textContent=ex.file+(ex.note?'. '+ex.note:'');
    var code=$('.r-code',root);code.innerHTML='';
    ex.parts.forEach(function(parts){
      parts.forEach(function(p){
        if(p.t!==undefined){code.appendChild(document.createTextNode(p.t));return}
        var i=p.b,v=fill[i];
        var b=el('button','blank'+(v?' f':'')+(res&&v?(res[i]?' ok':' bad'):''));
        b.type='button';b.textContent=v||' ';
        b.setAttribute('aria-label','Hueco '+(i+1)+(v?': '+v:': vacío'));
        b.onclick=function(){if(sel)setW(i,sel);else if(fill[i])setW(i,'')};
        b.ondragover=function(e){e.preventDefault();b.classList.add('over')};
        b.ondragleave=function(){b.classList.remove('over')};
        b.ondrop=function(e){e.preventDefault();var w=e.dataTransfer.getData('text/plain');if(w)setW(i,w)};
        code.appendChild(b);
      });
      code.appendChild(document.createTextNode('\n'));
    });
    var bank=$('.r-bank',root);bank.innerHTML='';
    words.forEach(function(w){
      var c=el('button','chip'+(sel===w?' sel':''),w);c.type='button';c.draggable=true;
      c.ondragstart=function(e){e.dataTransfer.setData('text/plain',w)};
      c.onclick=function(){sel=(sel===w)?null:w;render()};
      bank.appendChild(c);
    });
  }
  function check(){
    var empty=fill.filter(function(v){return!v}).length;
    if(empty){msg('Faltan '+empty+' huecos por rellenar.','bad');return}
    res=fill.map(function(v,i){return v===ex.items[i].a});
    var ok=res.filter(Boolean).length,n=res.length;
    if(ok===n){msg('Perfecto: '+ok+' de '+n+'.','good');onDone(ex.id)}
    else{
      msg(ok+' de '+n+' correctos. Toca un hueco rojo para borrarlo.','');
      var ul=$('.r-fb',root);
      res.forEach(function(r,i){if(!r){var li=el('li','', 'Hueco '+(i+1)+': pusiste '+fill[i]+'. Va '+ex.items[i].a+(ex.items[i].h?' ('+ex.items[i].h+')':'')+'.');ul.appendChild(li)}});
    }
    render();
  }
  root.addEventListener('click',function(e){
    var a=e.target&&e.target.getAttribute&&e.target.getAttribute('data-a');
    if(a==='check')check();
    else if(a==='solve'){fill=ex.items.map(function(it){return it.a});res=null;msg('');render()}
    else if(a==='reset'){fill=ex.items.map(function(){return''});res=null;sel=null;msg('');render()}
  });
  return{load:function(e){ex=e;fill=e.items.map(function(){return''});res=null;sel=null;words=shuf(e.bank);msg('');render()}};
}

<script>
var QS=[];
function Q(c,q,o,e,k){QS.push({c:c,q:q,o:o,e:e,k:k||''})}
var T='Teoría',E='Escalera type',M='Mal y bien',I='Índices',X='Interpretar EXPLAIN',J='JOIN y subconsultas',U='UPDATE y DELETE';

Q(T,"¿Qué hace EXPLAIN?",["Muestra cómo ejecutará el motor una consulta (plan de ejecución)","Ejecuta la consulta y guarda el resultado en otra tabla","Crea automáticamente los índices que faltan","Hace una copia de seguridad de la tabla"],"EXPLAIN enseña el plan: qué índices usaría, cuántas filas revisará y en qué orden hará las operaciones. Sirve para detectar cuellos de botella.");
Q(T,"¿Qué NO puedes ver con un EXPLAIN normal?",["El tiempo real exacto que tardó en ejecutarse","Si se usa algún índice","Cuántas filas estima procesar","El orden en que se ejecutarán las operaciones"],"EXPLAIN da un plan estimado, no tiempos reales. Para la ejecución real está ANALYZE FORMAT=JSON.");
Q(T,"El EXPLAIN tradicional de MariaDB devuelve...",["Un plan estimado, normalmente sin ejecutar el SELECT","Las filas del SELECT ya ordenadas","El tiempo real en milisegundos","Solo la lista de índices de la tabla"],"MariaDB analiza la consulta y muestra un plan estimado, normalmente sin ejecutarla para devolver sus filas.");
Q(T,"¿Qué diferencia a ANALYZE FORMAT=JSON de EXPLAIN?",["Ejecuta la consulta y da información de la ejecución real","Es más rápido porque no ejecuta nada","Solo sirve para UPDATE","Borra la caché de consultas"],"ANALYZE FORMAT=JSON ejecuta la consulta y aporta métricas reales. EXPLAIN solo estima.");
Q(T,"Plan estimado frente a ejecución real. ¿Cuál es la pareja correcta?",["EXPLAIN: qué cree MariaDB que hará. ANALYZE: qué trabajo ha hecho de verdad","EXPLAIN: trabajo real. ANALYZE: estimación","Los dos son solo estimaciones","Los dos ejecutan la consulta"],"Son dos conceptos distintos: plan estimado y ejecución real.");
Q(T,"El campo type de EXPLAIN indica...",["El método de acceso: cómo se buscan las filas","El tiempo que tardará la consulta","El tipo de dato de la columna","El número de filas devueltas"],"No indica cuánto tarda, sino cómo localiza MariaDB los registros.");
Q(T,"El campo possible_keys indica...",["Los índices que MariaDB considera candidatos","El índice que ha usado finalmente","Las claves primarias de la tabla","Las columnas del SELECT"],"Son candidatos. No significa que vaya a usarlos todos.");
Q(T,"El campo key indica...",["El índice que el optimizador ha elegido realmente","Todos los índices candidatos","El número de claves de la tabla","La clave foránea de la tabla"],"key es el índice elegido. No lo confundas con possible_keys.");
Q(T,"¿Qué pregunta responde cada campo?",["possible_keys: ¿qué índices podrían servir? key: ¿cuál ha elegido?","possible_keys: ¿cuál ha elegido? key: ¿cuáles podrían servir?","Los dos responden lo mismo","Ninguno tiene que ver con índices"],"possible_keys = candidatos. key = elegido.");
Q(T,"El campo rows es...",["Una estimación de las filas que examinará en ese paso","El número exacto de filas que devuelve la consulta","Las filas modificadas por un UPDATE","El número total de filas de la tabla siempre"],"Es una estimación del optimizador basada en estadísticas. No es el número de filas devueltas.");
Q(T,"Orden recomendado para analizar un EXPLAIN:",["type, possible_keys, key, rows y Extra","rows, key, type, Extra","Extra, rows, type, key","key, rows, possible_keys, type"],"Primero cómo accede (type), luego candidatos, luego el elegido, después las filas y por último Extra.");
Q(T,"¿Para qué sirve el campo Extra?",["Para ver indicadores adicionales como Using where, Using index o Using filesort","Para ver el nombre de la tabla","Para ver el usuario que ejecuta la consulta","Para ver el tamaño del índice"],"Extra añade información sobre cómo se resuelve la consulta.");
Q(T,"Una consulta es eficiente cuando...",["El plan da el resultado correcto con un coste razonable de recursos y tiempo","Simplemente usa un índice","Tiene muchos JOIN","Devuelve siempre pocas columnas"],"Usar un índice no basta: lo que cuenta es el coste total razonable.");
Q(T,"¿Menos filas estimadas significa siempre menos tiempo total?",["No: también influyen disco, tamaño de registros, memoria y operaciones adicionales","Sí, siempre","Solo en los UPDATE","Solo con JOIN"],"Menos filas estimadas es buena señal, pero no garantiza menor tiempo total.");
Q(T,"En una consulta con varios JOIN, EXPLAIN muestra...",["Normalmente una fila del plan por cada tabla; no se suman los rows como total exacto","Una única fila con el total","Solo la primera tabla","Un error de sintaxis"],"No debemos sumar todos los valores rows como si fueran el total exacto de registros procesados.");
Q(T,"Sobre normalizar la base de datos:",["Mantenerla normalizada, pero valorar desnormalizar en consultas muy frecuentes","Nunca se debe normalizar","Hay que desnormalizar siempre","Normalizar impide usar JOIN"],"Normalizar evita duplicidad y facilita los JOIN. A veces se desnormaliza para consultas muy frecuentes.");
Q(T,"¿Qué se usa para simplificar consultas complejas con subconsultas redundantes?",["Expresiones comunes de tabla (CTE)","SELECT * siempre","Borrar los índices","Duplicar la tabla"],"La técnica 5 propone simplificar con subconsultas menos redundantes o CTE y reorganizar filtros y JOIN para usar los índices.");
Q(T,"Los índices que no se usan...",["Pueden ralentizar INSERT y UPDATE, por eso conviene depurarlos","Aceleran siempre los INSERT","No tienen ningún coste","Bloquean toda la base de datos"],"Cada índice hay que mantenerlo al insertar o actualizar. Se revisan y se eliminan los innecesarios.");
Q(T,"¿En qué cláusulas conviene crear índices?",["WHERE, JOIN y ORDER BY","Solo en SELECT","Solo en INSERT","Solo en los comentarios"],"Se crean en columnas que se usan en WHERE, JOIN y ORDER BY.");
Q(T,"¿Qué columnas NO conviene indexar?",["Las de pocos valores distintos (poca selectividad)","Las que se usan en WHERE","Las que se usan en JOIN","Las que se usan en ORDER BY"],"Un índice sobre una columna con pocos valores distintos apenas reduce filas.");
Q(T,"Si EXPLAIN muestra ALL aunque exista un índice, ¿es necesariamente un error?",["No: si la consulta devuelve gran parte de la tabla, MariaDB puede preferir ALL","Sí, siempre es un error","Solo si hay JOIN","Sí, el índice está corrupto"],"Si el resultado abarca gran parte de la tabla, leerla entera puede ser más rápido.");
Q(T,"key = NULL significa...",["Que no se ha elegido ningún índice; no es automáticamente un problema","Que la tabla no existe","Un error de sintaxis","Que el índice está roto"],"Por ejemplo, leer una tabla pequeña completa puede ser más rápido que usar un índice.");
Q(T,"possible_keys = NULL significa...",["Que MariaDB no ve ningún índice candidato para ese acceso","Que hay demasiados índices","Que la tabla está vacía","Que el índice es compuesto"],"Puede ser porque no hay índices adecuados o porque la condición (por ejemplo, una función sobre la columna) no permite aprovecharlos.");
Q(T,"¿Cuándo se recomienda ejecutar EXPLAIN?",["Antes y después de crear índices o cambiar JOINs","Solo al final del curso","Solo en los INSERT","Nunca, es solo teoría"],"Así se comprueba si el cambio ha mejorado el plan.");
Q(T,"En un INSERT bien escrito, las columnas...",["Se declaran explícitamente","No se indican nunca","Se sustituyen por *","Se sustituyen por una subconsulta"],"Consejo: declara las columnas explícitamente en INSERT.");

Q(E,"type = ALL significa...",["Escaneo completo de la tabla","Búsqueda por índice único en un JOIN","Tabla con una única fila","Búsqueda por rango en un índice"],"ALL es un full table scan: potencialmente costoso. Evítalo si puedes.");
Q(E,"type = index significa...",["Recorrido completo de un índice","Búsqueda por rango","Escaneo completo de la tabla","Consulta que da como máximo una fila"],"No es lo ideal, pero es mejor que ALL. Depende del caso.");
Q(E,"type = range significa...",["Búsqueda por rango en un índice","Escaneo completo de la tabla","Tabla con una única fila","Recorrido de todo el índice"],"Generalmente eficiente. Sale con condiciones como salario > 50000 e índice en salario.");
Q(E,"type = ref significa...",["Búsqueda mediante un índice no único o un prefijo de índice","Escaneo completo","Tabla con una sola fila","Recorrido de todos los índices"],"Generalmente eficiente.");
Q(E,"type = eq_ref significa...",["Búsqueda por índice único en un JOIN","Escaneo completo de la tabla","Recorrido completo del índice","Rango de un índice no único"],"Muy eficiente. Típico en JOIN contra clave primaria o única.");
Q(E,"type = const significa...",["La búsqueda produce como máximo una fila","Escaneo completo de la tabla","Búsqueda por rango","Recorrido del índice entero"],"Muy eficiente: el resultado es constante.");
Q(E,"type = system significa...",["La tabla tiene una única fila","Es una tabla del sistema operativo","Escaneo completo","Rango de índice"],"Muy eficiente.");
Q(E,"Ordena de peor a mejor:",["ALL, index, range, ref, eq_ref, const","const, eq_ref, ref, range, index, ALL","index, ALL, range, const, ref, eq_ref","range, ALL, index, ref, const, eq_ref"],"ALL es lo peor, const lo mejor. Entre medias: index, range, ref y eq_ref.");
Q(E,"¿Cuál de estos types es el más eficiente?",["const","ALL","index","range"],"const produce como máximo una fila.");
Q(E,"¿Cuál de estos types es un full table scan?",["ALL","range","ref","const"],"ALL: examina toda la tabla.");
Q(E,"Tras CREATE INDEX idx_salario ON empleados(salario); el EXPLAIN de SELECT * FROM empleados WHERE salario > 50000; muestra normalmente...",["type: range","type: ALL","type: const","type: system"],"El índice se usa como búsqueda por rango y rows baja (en el ejemplo de 2000 a 300).");
Q(E,"Tras indexar id_departamento, un JOIN suele mostrar type...",["ref o eq_ref","ALL en las dos tablas","system","index siempre"],"Indica que se usan índices y la consulta mejora.");
Q(E,"index frente a ALL: ¿qué afirmación es correcta?",["index lee todo el índice y ALL toda la tabla; index suele ser mejor","Son idénticos","ALL es siempre mejor","index es un rango"],"index no es lo ideal, pero es mejor que ALL.");
Q(E,"Según el tema, ¿qué tipos busca siempre una consulta bien optimizada?",["RANGE, REF o EQ_REF","ALL","Solo INDEX","Solo SYSTEM"],"Consejo: busca que el tipo sea lo más eficiente posible (RANGE, REF, EQ_REF).");

Q(M,"¿Cuál es la mejor consulta?",["SELECT nombre, apellido, salario FROM empleados WHERE salario > 50000;","SELECT * FROM empleados;","SELECT * FROM empleados WHERE salario > 50000;","SELECT nombre, apellido, salario FROM empleados;"],"Solo las columnas necesarias y filtrando con WHERE.");
Q(M,"¿Qué problema tiene SELECT * FROM empleados;?",["Trae todas las columnas y todas las filas: más transferencia y proceso","Ninguno, es lo óptimo","Es sintaxis incorrecta","Bloquea la tabla siempre"],"Se cambia el * por las columnas realmente necesarias y se filtra.");
Q(M,"¿Cuál es el INSERT mejor escrito?",["INSERT INTO empleados (nombre, apellido, departamento, salario) VALUES ('Ana', 'González', 'Ventas', 35000);","INSERT INTO empleados VALUES ('Ana', 'González', 'Ventas', 35000);","INSERT empleados ('Ana', 'González', 'Ventas', 35000);","INSERT INTO empleados SELECT *;"],"Declarar las columnas evita errores si cambia la estructura de la tabla.");
Q(M,"¿Qué hace UPDATE empleados SET salario = 40000;?",["Cambia el salario de TODOS los empleados","Solo cambia al primero","Da error","No hace nada"],"Sin WHERE afecta a todas las filas: error masivo.");
Q(M,"¿Cuál es el UPDATE más seguro?",["UPDATE empleados SET salario = 40000 WHERE nombre = 'Ana' AND apellido = 'González';","UPDATE empleados SET salario = 40000;","UPDATE empleados SET salario = 40000 WHERE 1;","UPDATE empleados;"],"Ventajas: evita errores masivos y mejora el control.");
Q(M,"¿Qué hace DELETE FROM empleados;?",["Borra TODAS las filas de la tabla","Borra solo la primera fila","Borra la tabla entera con su estructura","Da error"],"Sin WHERE borra todo el contenido.");
Q(M,"¿Cuál es el DELETE más seguro?",["DELETE FROM empleados WHERE departamento = 'Ventas' AND salario < 20000;","DELETE FROM empleados;","DELETE * FROM empleados;","DELETE empleados WHERE;"],"Menor riesgo y control total.");
Q(M,"Hay un índice sobre fecha_contratacion. ¿Qué WHERE lo aprovecha mejor?",["WHERE fecha_contratacion BETWEEN '2020-01-01' AND '2020-12-31'","WHERE YEAR(fecha_contratacion) = 2020","WHERE UPPER(fecha_contratacion) = '2020'","WHERE DATE_FORMAT(fecha_contratacion, '%Y') = '2020'"],"Con una función sobre la columna no se aprovecha como rango. Con BETWEEN o >= y <= sí.");
Q(M,"¿Qué WHERE es mejor para sacar las contrataciones de 2023?",["WHERE fecha >= '2023-01-01' AND fecha < '2024-01-01'","WHERE YEAR(fecha) = 2023","WHERE MONTH(fecha) > 0","WHERE CAST(fecha AS CHAR) LIKE '2023%'"],"Compara la columna directamente con un rango.");
Q(M,"¿Por qué WHERE YEAR(fecha_contratacion) = 2020 es mala idea?",["Aplicar YEAR() a la columna impide usar el índice como búsqueda por rango","Porque YEAR no existe","Porque BETWEEN es siempre más lento","Porque obliga a crear dos índices"],"Reescríbelo como un rango de fechas.");
Q(M,"Con un índice sobre nombre, ¿qué WHERE es mejor?",["WHERE nombre = 'Ana'","WHERE UPPER(nombre) = 'ANA'","WHERE LOWER(nombre) = 'ana'","WHERE CONCAT(nombre, '') = 'Ana'"],"No uses funciones sobre columnas indexadas.");
Q(M,"¿Qué regla es correcta para el WHERE?",["No uses funciones sobre columnas indexadas","Usa funciones siempre que puedas","Evita filtrar en el WHERE","Usa SELECT * en el WHERE"],"Prefiere comparadores directos y rangos (BETWEEN, >=, <=) en vez de funciones.");
Q(M,"¿Cuál de estos consejos NO aparece en los apuntes?",["Usar SELECT * siempre","Seleccionar solo las columnas necesarias","Usar WHERE sabiamente","Preferir JOIN sobre subconsultas cuando sea posible"],"SELECT * es justo lo que se desaconseja.");
Q(M,"Filtrar lo máximo posible en el WHERE sirve para...",["Reducir el trabajo del motor y los datos transferidos","Hacer la consulta más larga","Evitar el uso de índices","Obligar a un ALL"],"Es la técnica 3: optimizar la cláusula WHERE.");
Q(M,"¿Cuál de estas consultas usa mejor un rango de salario?",["WHERE salario BETWEEN 30000 AND 40000","WHERE ABS(salario) BETWEEN 30000 AND 40000","WHERE salario + 0 BETWEEN 30000 AND 40000","WHERE ROUND(salario) >= 30000 AND ROUND(salario) <= 40000"],"Se compara la columna directamente.");
Q(M,"Para listar solo id y nombre de departamento, ¿qué escribes?",["SELECT id, nombre FROM departamento;","SELECT * FROM departamento;","SELECT ALL FROM departamento;","SELECT departamento FROM id, nombre;"],"Solo las columnas necesarias.");
Q(M,"¿Qué técnica aplicas si quieres que se usen los índices disponibles en una consulta compleja?",["Reorganizar los filtros y JOIN","Añadir más subconsultas","Quitar todos los WHERE","Usar siempre SELECT *"],"Es la técnica 5: reescribir consultas complejas.");

Q(I,"Para WHERE salario > 50000, ¿qué índice creas?",["CREATE INDEX idx_salario ON empleados(salario);","CREATE INDEX idx_nombre ON empleados(nombre);","CREATE INDEX idx_salario ON salario(empleados);","DROP INDEX idx_salario;"],"Se indexa la columna del WHERE.");
Q(I,"Para UPDATE empleados SET salario = salario * 1.1 WHERE departamento = 'Ventas'; ¿qué índice ayuda?",["CREATE INDEX idx_departamento ON empleados(departamento);","CREATE INDEX idx_salario ON empleados(salario);","CREATE INDEX idx_ventas ON empleados(Ventas);","DROP INDEX idx_departamento ON empleados;"],"El WHERE filtra por departamento. Tras el índice, EXPLAIN muestra range.");
Q(I,"Para un JOIN empleados.id_departamento = departamento.id, ¿qué índice añades?",["CREATE INDEX idx_id_departamento ON empleados(id_departamento);","CREATE INDEX idx_nombre ON departamento(nombre);","CREATE INDEX idx_id ON empleados(id);","DROP INDEX id ON departamento;"],"Se indexa la columna que une las tablas.");

function qHtml(q,order,state){
  var h='<div class="qmeta"><span class="tag">'+esc(q.c)+'</span></div><p class="qt">'+esc(q.q)+'</p>';

  var q=ex.list[ex.i];
  $('#exc',ps).textContent='Pregunta '+(ex.i+1)+' de '+EXAM_N+' · '+ex.ans.filter(function(a){return a>=0}).length+' contestadas';
  $$('.gn',ps).forEach(function(b,k){b.classList.toggle('on',k===ex.i);b.classList.toggle('dn',ex.ans[k]>=0)});
  $('#exq',ps).innerHTML=qHtml(q,ex.orders[ex.i],{pick:ex.ans[ex.i]});
  $$('.opt',$('#exq',ps)).forEach(function(b){b.onclick=function(){ex.ans[ex.i]=+b.getAttribute('data-p');ex.sure=false;$('#exmsg',ps).textContent='';paintEx()}});
  $('#exprev',ps).disabled=ex.i===0;$('#exnext',ps).disabled=ex.i===EXAM_N-1;
}
function finish(){
  var un=ex.ans.filter(function(a){return a<0}).length,m=$('#exmsg',ps);
  if(un>0&&!ex.sure){ex.sure=true;m.className='r-msg bad';m.textContent='Te faltan '+un+' preguntas sin contestar. Pulsa otra vez para corregir igualmente.';return}
  ex.over=true;
  var ok=0,bad=[];
  ex.list.forEach(function(q,k){var good=ex.ans[k]>=0&&ex.orders[k][ex.ans[k]]===0;if(good)ok++;else bad.push(k);S.r[q.id]=good?1:0});
  var nota=Math.round(ok*100/EXAM_N)/10;
  if(nota>S.best)S.best=nota;save();refresh();
  var h='<div class="card"><h3>Resultado</h3><p class="big">'+ok+' de '+EXAM_N+' · nota '+nota.toFixed(1).replace('.',',')+' sobre 10</p><p class="lead" style="margin:0 0 12px">Calculada sin penalización por fallo. Tu mejor nota: '+S.best.toFixed(1).replace('.',',')+'.</p><div class="r-btns"><button type="button" class="btn primary" id="exnew">Nuevo simulacro</button></div></div>';
  if(bad.length){
    h+='<div class="card"><h3>Revisa tus '+bad.length+' fallos</h3>';
    bad.forEach(function(k){
      var q=ex.list[k],o=ex.orders[k],mine=ex.ans[k]>=0?q.o[o[ex.ans[k]]]:'Sin contestar';
      h+='<div class="rev"><p class="qt">'+(k+1)+'. '+esc(q.q)+'</p>'+(q.k?'<pre class="qk">'+esc(q.k)+'</pre>':'')+'<p class="rv bad">Tu respuesta: '+esc(mine)+'</p><p class="rv good">Correcta: '+esc(q.o[0])+'</p><p class="rx">'+esc(q.e)+'</p></div>';
    });
    h+='</div>';
  }
  ps.innerHTML=h;$('#exnew',ps).onclick=newExam;
  try{window.scrollTo(0,0)}catch(e){}
}

function refresh(){
  var ok=QS.filter(function(q){return S.r[q.id]===1}).length;
  var c=$('#bd-card-count');if(c)c.textContent=ok+' de '+N+' preguntas acertadas';
  var s=$('#bd-sum');if(s)s.textContent=ok+' de '+N+' acertadas'+(S.best?' · mejor simulacro '+S.best.toFixed(1).replace('.',','):'');
  var bar=$('#bd-bar');if(bar)bar.style.width=Math.round(ok*100/N)+'%';
}
function route(){
  var h=(location.hash||'').slice(1);
  if(h!=='bd'&&h.indexOf('bd-')!==0)return;
  var id=h.slice(3);if(!$('#bdp-'+id))id='resumen';
  $$('#bd-panels .panel').forEach(function(p){p.hidden=(p.id!=='bdp-'+id)});
  $$('a',tabs).forEach(function(a){a.classList.toggle('on',a.getAttribute('data-t')===id)});
}
window.addEventListener('hashchange',route);
start('Todas');newExam();refresh();route();
})();

</script>
