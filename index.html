<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aula de estudio ASIR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: inicio con tarjetas de asignaturas; dentro, un servicio por pestaña: mapa, tabla de cambios y ejercicios */
  --bg:#f2f5f7; --surface:#ffffff; --ink:#13222b; --muted:#566874; --line:#d5dde3; --line-strong:#aebbc4;
  --accent:#0b7a75; --accent-soft:#d8efec; --on-accent:#ffffff;
  --violet:#5b4bc4; --violet-soft:#e5e2fa;
  --good:#1b7f4b; --good-soft:#dbf3e5; --bad:#b3261e; --bad-soft:#fbe1de; --code-bg:#e9eef2;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b1216; --surface:#121c22; --ink:#e5eef2; --muted:#8ea2ad; --line:#243540; --line-strong:#3b5260;
    --accent:#3cc4b8; --accent-soft:#12373a; --on-accent:#062a27;
    --violet:#a99cf5; --violet-soft:#272352;
    --good:#5fd08e; --good-soft:#12301f; --bad:#ff8a80; --bad-soft:#3a1a18; --code-bg:#0e171c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1216; --surface:#121c22; --ink:#e5eef2; --muted:#8ea2ad; --line:#243540; --line-strong:#3b5260;
  --accent:#3cc4b8; --accent-soft:#12373a; --on-accent:#062a27;
  --violet:#a99cf5; --violet-soft:#272352;
  --good:#5fd08e; --good-soft:#12301f; --bad:#ff8a80; --bad-soft:#3a1a18; --code-bg:#0e171c;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--body);-webkit-text-size-adjust:100%}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{border-bottom:1px solid var(--line);background:var(--surface)}
.top .in{max-width:1040px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font:700 18px var(--display)}
.logo{background:var(--accent);color:var(--on-accent);border-radius:6px;padding:2px 8px;font:700 14px var(--mono);letter-spacing:.04em}
.grade{color:var(--muted);font-size:14px}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px 56px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:32px;line-height:1.15}
h2{font-size:26px;line-height:1.2}
h3{font-size:17px;margin-bottom:10px}
.lead{color:var(--muted);margin:6px 0 22px;max-width:62ch}
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.subj{display:block;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;color:inherit;text-decoration:none}
.subj.on:hover{border-color:var(--accent)}
.subj.off{opacity:.6}
.ban{height:92px}
.subj .tx{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.subj h3{font-size:15px;margin:0;line-height:1.3}
.subj .sub{font-size:13px;color:var(--muted)}
.badge{align-self:flex-start;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.subj.off .badge{background:var(--code-bg);color:var(--muted)}
.b1{background:linear-gradient(90deg,rgba(255,255,255,.22) 2px,transparent 2px) 0 0/24px 24px,linear-gradient(rgba(255,255,255,.22) 2px,transparent 2px) 0 0/24px 24px,#2a86a3}
.b2{background:repeating-linear-gradient(60deg,rgba(255,255,255,.22) 0 40px,transparent 40px 80px),#69bdbe}
.b3{background:repeating-linear-gradient(-60deg,rgba(0,0,0,.1) 0 40px,transparent 40px 80px),#1fa384}
.b4{background:radial-gradient(circle at 22% 30%,#2a8a96 0,transparent 42%),radial-gradient(circle at 80% 80%,#1c5a73 0,transparent 45%),#0e2430}
.b5{background:repeating-linear-gradient(60deg,rgba(255,255,255,.14) 0 45px,transparent 45px 90px),#6a58d2}
.b6{background:radial-gradient(circle,transparent 0 16px,rgba(255,255,255,.3) 16px 18px,transparent 18px) 0 0/42px 42px,#66c0be}
.b7{background:repeating-linear-gradient(90deg,rgba(255,255,255,.16) 0 12px,transparent 12px 24px),repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 12px,transparent 12px 24px),#1a78dc}
.b8{background:radial-gradient(circle,rgba(255,255,255,.3) 1.5px,transparent 2px) 0 0/26px 26px,linear-gradient(120deg,#0d2a3b,#15556f)}
.soon{color:var(--muted);font-size:14px;margin-top:18px}
.crumb{display:inline-block;margin-bottom:10px;font-size:14px;text-decoration:none}
.sum{display:flex;align-items:center;gap:14px;margin:14px 0 18px;flex-wrap:wrap}
.sum .bar{flex:1;min-width:160px;height:8px;border-radius:99px;background:var(--code-bg);overflow:hidden}
.sum .bar i{display:block;height:100%;width:0;background:var(--accent)}
.sum span{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs a{padding:8px 16px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);text-decoration:none;font-weight:500;font-size:14px}
.tabs a.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.card svg{display:block;width:100%;max-width:680px;margin:0 auto;height:auto}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:13px}
td:first-child{font-weight:500;white-space:nowrap}
.rules{margin:12px 0 0;padding-left:18px;font-size:14px;color:var(--muted)}
.rules li{margin:3px 0}
svg .t{font:500 14px var(--body);fill:var(--ink)}
svg .ts{font:400 12px var(--body);fill:var(--muted)}
svg .bn{fill:var(--surface);stroke:var(--line-strong);stroke-width:1}
svg .ba{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1}
svg .bv{fill:var(--violet-soft);stroke:var(--violet);stroke-width:1}
svg .dash{fill:none;stroke:var(--line-strong);stroke-width:1;stroke-dasharray:4 4}
svg .ar{stroke:var(--muted);stroke-width:1.5;fill:none}
svg .lf{stroke:var(--line-strong);stroke-width:1;stroke-dasharray:3 4}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.pill,.btn{font:500 14px var(--body);padding:7px 12px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer}
.pill:hover,.btn:hover{border-color:var(--accent)}
.pill.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.pill.done::before{content:"\2713\00a0"}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.r-note{font-size:14px;color:var(--muted);margin-bottom:8px}
.r-code{font:400 13px/2.15 var(--mono);white-space:pre-wrap;background:var(--code-bg);border-radius:10px;padding:12px 14px;color:var(--ink);overflow-wrap:anywhere}
.blank{font:inherit;display:inline-block;min-width:68px;padding:0 6px;line-height:1.7;border:1px dashed var(--line-strong);border-radius:5px;background:var(--surface);color:var(--ink);cursor:pointer;text-align:center}
.blank.f{border-style:solid}
.blank.over{background:var(--accent-soft);border-color:var(--accent)}
.blank.ok{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.blank.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.r-help{font-size:13px;color:var(--muted);margin:10px 0 6px}
.r-bank{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:400 13px var(--mono);padding:5px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);cursor:grab;user-select:none}
.chip.sel{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.r-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.r-msg{margin-top:10px;font-weight:500;min-height:1.5em}
.r-msg.good{color:var(--good)} .r-msg.bad{color:var(--bad)}
.r-fb{margin:6px 0 0;padding-left:18px;font-size:14px;color:var(--muted)}
.exhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.tag{font-size:13px;font-weight:500;padding:2px 10px;border-radius:999px;background:var(--violet-soft);color:var(--violet)}
@media (max-width:520px){h1{font-size:26px}h2{font-size:22px}}
</style>
</head>
<body>
<header class="top"><div class="in"><a class="brand" href="#inicio"><span class="logo">ASIR</span><span>Aula de estudio</span></a><span class="grade">2º ASIR Vespertino</span></div></header>
<div class="wrap">
<section id="view-inicio">
<h1>Tus asignaturas</h1>
<p class="lead">Elige una asignatura para estudiar. Por ahora está lista la parte práctica de Servicios en Red e Internet.</p>

</div>
<script>
var EX=[
{id:'dns-local-p',svc:'dns',tab:'named.conf.local · primario',file:'server1 · /etc/bind/named.conf.local',note:'',

{id:'dns-local-s',svc:'dns',tab:'named.conf.local · secundario',file:'server2 · /etc/bind/named.conf.local',note:'Cambia solo una palabra respecto al primario. Los masters ya vienen puestos.',

'               3w         ; Expire',

'[[12.20|20.28.20.12: dos últimos octetos al revés]]   IN  [[PTR]]  [[server2.examen.com]].   ; DNS secundario',
'[[11.100|20.28.100.11: al revés es 11.100]]  IN  [[PTR]]  [[turno1.examen.com]].   ; turno1',
'[[12.200|20.28.200.12: al revés es 12.200]]  IN  [[PTR]]  [[turno2.examen.com]].   ; turno2',
'[[12.200|mail es turno2: mismo propietario]]  IN  [[PTR]]  [[mail.examen.com]].   ; mail',
'[[11.100|www es turno1: mismo propietario]]  IN  [[PTR]]  [[www.examen.com]].   ; www']},

function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

function Runner(root,onDone){
  root.innerHTML='<div class="r-note"></div><div class="r-code" role="group" aria-label="Fichero con huecos"></div><p class="r-help">Toca una palabra y luego un hueco, o arrástrala. Se pueden repetir y algunas sobran.</p><div class="r-bank"></div><div class="r-btns"><button type="button" class="btn primary" data-a="check">Comprobar</button><button type="button" class="btn" data-a="solve">Ver solución</button><button type="button" class="btn" data-a="reset">Reiniciar</button></div><div class="r-msg" aria-live="polite"></div><ul class="r-fb"></ul>';
  var ex=null,fill=[],res=null,sel=null,words=[];
  function msg(t,c){var m=$('.r-msg',root);m.textContent=t;m.className='r-msg'+(c?' '+c:'');$('.r-fb',root).innerHTML=''}
  function setW(i,w){fill[i]=w;res=null;msg('');render()}
  function render(){
    $('.r-note',root).textContent=ex.file+(ex.note?'. '+ex.note:'');
    var code=$('.r-code',root);code.innerHTML='';
    ex.parts.forEach(function(parts){
      parts.forEach(function(p){
        if(p.t!==undefined){code.appendChild(document.createTextNode(p.t));return}
        var i=p.b,v=fill[i];
        var b=el('button','blank'+(v?' f':'')+(res&&v?(res[i]?' ok':' bad'):''));
        b.type='button';b.textContent=v||' ';
        b.setAttribute('aria-label','Hueco '+(i+1)+(v?': '+v:': vacío'));
        b.onclick=function(){if(sel)setW(i,sel);else if(fill[i])setW(i,'')};
        b.ondragover=function(e){e.preventDefault();b.classList.add('over')};
        b.ondragleave=function(){b.classList.remove('over')};
        b.ondrop=function(e){e.preventDefault();var w=e.dataTransfer.getData('text/plain');if(w)setW(i,w)};
        code.appendChild(b);
      });
      code.appendChild(document.createTextNode('\n'));
    });
    var bank=$('.r-bank',root);bank.innerHTML='';
    words.forEach(function(w){
      var c=el('button','chip'+(sel===w?' sel':''),w);c.type='button';c.draggable=true;
      c.ondragstart=function(e){e.dataTransfer.setData('text/plain',w)};
      c.onclick=function(){sel=(sel===w)?null:w;render()};
      bank.appendChild(c);
    });
  }
  function check(){
    var empty=fill.filter(function(v){return!v}).length;
    if(empty){msg('Faltan '+empty+' huecos por rellenar.','bad');return}
    res=fill.map(function(v,i){return v===ex.items[i].a});
    var ok=res.filter(Boolean).length,n=res.length;
    if(ok===n){msg('Perfecto: '+ok+' de '+n+'.','good');onDone(ex.id)}
    else{
      msg(ok+' de '+n+' correctos. Toca un hueco rojo para borrarlo.','');
      var ul=$('.r-fb',root);
      res.forEach(function(r,i){if(!r){var li=el('li','', 'Hueco '+(i+1)+': pusiste '+fill[i]+'. Va '+ex.items[i].a+(ex.items[i].h?' ('+ex.items[i].h+')':'')+'.');ul.appendChild(li)}});
    }
    render();
  }
  root.addEventListener('click',function(e){
    var a=e.target&&e.target.getAttribute&&e.target.getAttribute('data-a');
    if(a==='check')check();
    else if(a==='solve'){fill=ex.items.map(function(it){return it.a});res=null;msg('');render()}
    else if(a==='reset'){fill=ex.items.map(function(){return''});res=null;sel=null;msg('');render()}
  });
  return{load:function(e){ex=e;fill=e.items.map(function(){return''});res=null;sel=null;words=shuf(e.bank);msg('');render()}};
}

    var b=el('button','pill'+(i===0?' on':''),e.tab);b.type='button';b.setAttribute('data-id',e.id);
    b.onclick=function(){$$('.pill',pills).forEach(function(x){x.classList.remove('on')});b.classList.add('on');runner.load(e)};
    pills.appendChild(b);
  });
  runner.load(list[0]);
});

var ea=el('a','','Modo examen');ea.href='#sri-examen';ea.setAttribute('data-t','examen');tabs.appendChild(ea);
var ep=el('section','panel');ep.id='panel-examen';ep.hidden=true;
ep.innerHTML='<div class="card"><h3>Modo examen</h3><p class="lead" style="margin:0 0 14px">Te sale un fichero al azar de cualquier servicio. Rellénalo sin mirar la teoría, como en el examen.</p><div class="exhead"><span class="tag"></span><button type="button" class="btn primary" id="next">Otro al azar</button></div><div class="runner"></div></div>';
panels.appendChild(ep);
var er=Runner($('.runner',ep),onDone),last=null;
function rnd(){
  var pool=EX.filter(function(e){return e!==last}),e=pool[Math.floor(Math.random()*pool.length)];
  last=e;$('.tag',ep).textContent=NAMES[e.svc]+' · '+e.tab;er.load(e);
}
$('#next').onclick=rnd;rnd();

var CARDS=[
 ['b1','Administración de Sistemas Operativos'],
 ['b2','Administración de Sistemas Gestores de Bases de Datos'],
 ['b3','Arquitectura Cloud'],
 ['b4','Digitalización'],
 ['b5','Implantación de Aplicaciones Web'],
 ['b6','Inglés'],
 ['b7','Seguridad y Alta disponibilidad'],
 ['b8','Servicios en Red e Internet']
];
var sg=$('#subjects');
CARDS.forEach(function(c){
  var on=c[0]==='b8',a=el(on?'a':'div','subj '+(on?'on':'off'));
  if(on)a.href='#sri';else a.setAttribute('aria-disabled','true');
  a.innerHTML='<div class="ban '+c[0]+'"></div><div class="tx"><h3>'+esc(c[1])+'</h3><span class="sub">2º ASIR Vespertino</span>'+(on?'<span class="badge">Parte práctica disponible</span><span class="sub" id="sri-card-count"></span>':'<span class="badge">Próximamente</span>')+'</div>';
  sg.appendChild(a);
});

var lastView='';
function route(){
  var h=(location.hash||'#inicio').slice(1);
  if(h==='sri')h='sri-dns';
  var inSri=h.indexOf('sri-')===0,view=inSri?'sri':'inicio';
  $('#view-inicio').hidden=inSri;$('#view-sri').hidden=!inSri;
  if(inSri){
    var id=h.slice(4);if(!$('#panel-'+id))id='dns';
    $$('.panel').forEach(function(p){p.hidden=(p.id!=='panel-'+id)});
    $$('a',tabs).forEach(function(a){a.classList.toggle('on',a.getAttribute('data-t')===id)});
  }
  if(view!==lastView){try{window.scrollTo(0,0)}catch(e){}lastView=view}
}
window.addEventListener('hashchange',route);
refresh();route();
})();

</script>
